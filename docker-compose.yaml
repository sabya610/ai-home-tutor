# Portable, pull-only compose — no source tree needed.
# Run on any laptop with Docker:  docker compose -f docker-compose.yaml up -d
# Then open http://localhost:8000
services:
  ollama:
    image: sabya610/ai-home-tutor-ollama:1b
    container_name: ai-home-tutor-ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  tutor:
    image: sabya610/ai-home-tutor:v13
    container_name: ai-home-tutor
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      AI_MODE: auto
      TUTOR_BASE_URL: http://ollama:11434/v1
      TUTOR_MODEL: llama3.2:1b
      TUTOR_API_KEY: not-needed
      TUTOR_MAX_TOKENS: "220"
      # OpenAI cloud tutor (GPT-5.6 Luna). Provide the key via host env or a .env
      # file next to this compose file — never hard-code the real key here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUD_TUTOR_MODEL: ${CLOUD_TUTOR_MODEL:-gpt-5.6-luna}
      # Corporate proxy TLS: mount its root CA and set OPENAI_CA_BUNDLE to the
      # in-container path, or set OPENAI_INSECURE_SKIP_VERIFY=1 (dev-only).
      OPENAI_CA_BUNDLE: ${OPENAI_CA_BUNDLE:-}
      OPENAI_INSECURE_SKIP_VERIFY: ${OPENAI_INSECURE_SKIP_VERIFY:-false}
    volumes:
      - ./data:/app/backend/data
      # - ./corp-proxy-ca.pem:/certs/corp-ca.pem:ro   # then OPENAI_CA_BUNDLE=/certs/corp-ca.pem
    restart: unless-stopped
